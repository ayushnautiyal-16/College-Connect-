    <!-- Left side content -->
    <rect x="40" y="58" width="130" height="22" rx="11" fill="#1E1145" stroke="#7C3AED" stroke-width="0.8" opacity="0.9"/>
    <text x="105" y="73" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#A78BFA" font-weight="600" letter-spacing="0.8">ADMISSIONS OPEN 2026</text>

