    <circle cx="580" cy="50" r="60" fill="none" stroke="#7C3AED" stroke-width="0.5" opacity="0.2"/>
    <circle cx="580" cy="50" r="80" fill="none" stroke="#EC4899" stroke-width="0.5" opacity="0.12"/>
    <circle cx="80" cy="370" r="30" fill="none" stroke="#EC4899" stroke-width="0.5" opacity="0.35"/>
    <circle cx="80" cy="370" r="55" fill="none" stroke="#7C3AED" stroke-width="0.5" opacity="0.18"/>

