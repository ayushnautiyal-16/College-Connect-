    <text x="48" y="182" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="url(#accentLine)">in Dehradun</text>

    <text x="48" y="220" font-family="system-ui,sans-serif" font-size="12" fill="#94A3B8">Not sure which college? We guide you</text>
    <text x="48" y="238" font-family="system-ui,sans-serif" font-size="12" fill="#94A3B8">step by step — free counseling, verified</text>
    <text x="48" y="256" font-family="system-ui,sans-serif" font-size="12" fill="#94A3B8">seats, zero stress.</text>

    <rect x="48" y="278" width="110" height="52" rx="10" fill="#1E2235" stroke="#2A3050" stroke-width="0.8"/>
    <text x="103" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">5000+</text>
    <text x="103" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7C85A2" letter-spacing="0.5">STUDENTS PLACED</text>

    <rect x="170" y="278" width="110" height="52" rx="10" fill="#1E2235" stroke="#2A3050" stroke-width="0.8"/>
    <text x="225" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">100%</text>
    <text x="225" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7C85A2" letter-spacing="0.5">SUCCESS RATE</text>

    <!-- Right form card -->
    <rect x="370" y="30" width="290" height="360" rx="16" fill="#111827" fill-opacity="0.85" stroke="#1E2744" stroke-width="1"/>

    <text x="390" y="72" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Apply </text>
    <text x="452" y="72" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="url(#accentLine)">Now</text>
    <text x="390" y="92" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">Fill in your details to begin your journey.</text>

    <text x="390" y="122" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.8">FULL NAME</text>
    <rect x="390" y="130" width="250" height="38" rx="8" fill="#1A2035" stroke="#2A3550" stroke-width="0.8"/>
    <text x="408" y="154" font-family="system-ui,sans-serif" font-size="12" fill="#3A4A6A">e.g. Alex Johnson</text>

    <text x="390" y="192" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.8">MOBILE NUMBER</text>
    <rect x="390" y="200" width="250" height="38" rx="8" fill="#1A2035" stroke="#2A3550" stroke-width="0.8"/>
    <text x="408" y="224" font-family="system-ui,sans-serif" font-size="12" fill="#3A4A6A">e.g. 98765 43210</text>

    <text x="390" y="262" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.8">DREAM COLLEGE</text>
    <rect x="390" y="270" width="250" height="38" rx="8" fill="#1A2035" stroke="#2A3550" stroke-width="0.8"/>
    <text x="408" y="294" font-family="system-ui,sans-serif" font-size="12" fill="#3A4A6A">Select your target college...</text>
    <path d="M624 284 L630 290 L636 284" fill="none" stroke="#3A4A6A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="390" y="328" width="250" height="42" rx="10" fill="url(#btnGrad)"/>
    <text x="515" y="354" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">GET STARTED NOW  →</text>

    <circle cx="393" cy="388" r="4" fill="#22C55E"/>
    <text x="402" y="392" font-family="system-ui,sans-serif" font-size="10" fill="#64748B">100% Secure &amp; Confidential</text>
  </g>
</svg>
