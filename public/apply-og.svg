<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>College Connect Apply Now background</title>
  <desc>Dark navy mesh gradient background with purple and pink glowing blobs, geometric dot grid, and decorative elements for the Apply Now section</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1F"/>
      <stop offset="100%" stop-color="#0D1128"/>
    </linearGradient>
    <linearGradient id="blob1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blob2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blob3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="bgClip">
      <rect width="680" height="420" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bgClip)">
    <rect width="680" height="420" fill="url(#bg)"/>

    <ellipse cx="560" cy="60" rx="220" ry="180" fill="url(#blob1)"/>
    <ellipse cx="100" cy="360" rx="200" ry="160" fill="url(#blob2)"/>
    <ellipse cx="80" cy="100" rx="140" ry="120" fill="url(#blob3)"/>

    <g opacity="0.18" stroke="#A78BFA" stroke-width="0.5" fill="none">
      <line x1="0" y1="60" x2="680" y2="60"/>
      <line x1="0" y1="120" x2="680" y2="120"/>
      <line x1="0" y1="180" x2="680" y2="180"/>
      <line x1="0" y1="240" x2="680" y2="240"/>
      <line x1="0" y1="300" x2="680" y2="300"/>
      <line x1="0" y1="360" x2="680" y2="360"/>
      <line x1="60" y1="0" x2="60" y2="420"/>
      <line x1="120" y1="0" x2="120" y2="420"/>
      <line x1="180" y1="0" x2="180" y2="420"/>
      <line x1="240" y1="0" x2="240" y2="420"/>
      <line x1="300" y1="0" x2="300" y2="420"/>
      <line x1="360" y1="0" x2="360" y2="420"/>
      <line x1="420" y1="0" x2="420" y2="420"/>
      <line x1="480" y1="0" x2="480" y2="420"/>
      <line x1="540" y1="0" x2="540" y2="420"/>
      <line x1="600" y1="0" x2="600" y2="420"/>
    </g>

    <g fill="#A78BFA" opacity="0.25">
      <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/>
      <circle cx="240" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="360" cy="60" r="1.5"/>
      <circle cx="420" cy="60" r="1.5"/><circle cx="480" cy="60" r="1.5"/><circle cx="540" cy="60" r="1.5"/>
      <circle cx="600" cy="60" r="1.5"/><circle cx="60" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/>
      <circle cx="180" cy="120" r="1.5"/><circle cx="240" cy="120" r="1.5"/><circle cx="300" cy="120" r="1.5"/>
      <circle cx="360" cy="120" r="1.5"/><circle cx="420" cy="120" r="1.5"/><circle cx="480" cy="120" r="1.5"/>
      <circle cx="540" cy="120" r="1.5"/><circle cx="600" cy="120" r="1.5"/><circle cx="60" cy="180" r="1.5"/>
      <circle cx="120" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/><circle cx="240" cy="180" r="1.5"/>
      <circle cx="300" cy="180" r="1.5"/><circle cx="360" cy="180" r="1.5"/><circle cx="420" cy="180" r="1.5"/>
      <circle cx="480" cy="180" r="1.5"/><circle cx="540" cy="180" r="1.5"/><circle cx="600" cy="180" r="1.5"/>
      <circle cx="60" cy="240" r="1.5"/><circle cx="120" cy="240" r="1.5"/><circle cx="180" cy="240" r="1.5"/>
      <circle cx="240" cy="240" r="1.5"/><circle cx="300" cy="240" r="1.5"/><circle cx="360" cy="240" r="1.5"/>
      <circle cx="420" cy="240" r="1.5"/><circle cx="480" cy="240" r="1.5"/><circle cx="540" cy="240" r="1.5"/>
      <circle cx="600" cy="240" r="1.5"/><circle cx="60" cy="300" r="1.5"/><circle cx="120" cy="300" r="1.5"/>
      <circle cx="180" cy="300" r="1.5"/><circle cx="240" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/>
      <circle cx="360" cy="300" r="1.5"/><circle cx="420" cy="300" r="1.5"/><circle cx="480" cy="300" r="1.5"/>
      <circle cx="540" cy="300" r="1.5"/><circle cx="600" cy="300" r="1.5"/><circle cx="60" cy="360" r="1.5"/>
      <circle cx="120" cy="360" r="1.5"/><circle cx="180" cy="360" r="1.5"/><circle cx="240" cy="360" r="1.5"/>
      <circle cx="300" cy="360" r="1.5"/><circle cx="360" cy="360" r="1.5"/><circle cx="420" cy="360" r="1.5"/>
      <circle cx="480" cy="360" r="1.5"/><circle cx="540" cy="360" r="1.5"/><circle cx="600" cy="360" r="1.5"/>
