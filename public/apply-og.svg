      <polygon points="50,200 60,218 40,218" fill="none" stroke="#EC4899" stroke-width="0.8"/>
      <rect x="620" y="300" width="18" height="18" rx="2" fill="none" stroke="#7C3AED" stroke-width="0.8" transform="rotate(20 629 309)"/>
      <rect x="30" y="280" width="14" height="14" rx="2" fill="none" stroke="#A78BFA" stroke-width="0.8" transform="rotate(-15 37 287)"/>
      <circle cx="660" cy="220" r="5" fill="none" stroke="#EC4899" stroke-width="0.8"/>
      <circle cx="20" cy="155" r="4" fill="none" stroke="#7C3AED" stroke-width="0.8"/>
