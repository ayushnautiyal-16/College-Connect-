version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - echo "NEXT_PUBLIC_GOOGLE_ADS_ID=$NEXT_PUBLIC_GOOGLE_ADS_ID" >> .env.production
        - echo "NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_SEND_TO=$NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_SEND_TO" >> .env.production
        - echo "DB_HOST=$DB_HOST" >> .env.production
        - echo "DB_USER=$DB_USER" >> .env.production
        - echo "DB_PASSWORD=$DB_PASSWORD" >> .env.production
        - echo "DB_NAME=$DB_NAME" >> .env.production
        - echo "NEXT_PUBLIC_CLOUDFRONT_URL=$NEXT_PUBLIC_CLOUDFRONT_URL" >> .env.production
        - echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env.production
        - echo "EMAIL_USER=$EMAIL_USER" >> .env.production
        - cat .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*